# Docker Compose override for the non-speculative control.  It replaces only
# `server.command`; every remaining service, mount, environment variable,
# cache allocation, scheduler setting, and port comes from the production
# compose file selected by the benchmark wrapper.
services:
  server:
    restart: "no"
    command: !override
      - --model
      - /models/target
      - --revision
      - 69274a0d8dff5dd35bcee8290612f71e03b6e981
      - --served-model-name
      - qwen3.8-27b-nvfp4-dflash2
      - --quantization
      - modelopt
      - --trust-remote-code
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking":true,"reasoning_effort":"medium"}'
      - --override-generation-config
      - '{"temperature":0.6}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --chat-template
      - /opt/vllm-release/chat-template.jinja
      - --enable-mm-embeds
      - --limit-mm-per-prompt
      - '{"image":0,"video":0}'
      - --kv-cache-dtype
      - nvfp4
      - --kv-cache-memory-bytes
      - "8589934592"
      - --mamba-ssm-cache-dtype
      - bfloat16
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "4096"
      - --long-prefill-token-threshold
      - "2048"
      - --scheduling-policy
      - priority
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --compilation-config
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[8,16,24,32]}'
      - --attention-config
      - '{"flash_attn_version":2}'
